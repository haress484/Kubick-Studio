<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kubick Studio — Counter Aleksekys, Saratov Parkur, Dota Drop, Minecraft Drop</title>
<meta name="description" content="Kubick Studio (Kubicki) — независимая инди-студия. Игры Counter Aleksekys (Aleksekus, Контер Алексекус) и Saratov Parkur (Sattarov), а также проекты Dota Drop и Minecraft Drop (Дота Дроп, Майнкрафт Дроп).">
<meta name="keywords" content="Kubick, Kubick Studio, Kubicki, Counter Aleksekus, Aleksekus, Контер Алексекус, Sattarov, Sattarov Parkur, Dota Drop, Дота Дроп, Minecraft Drop, Майнкрафт Дроп, Майн Дроп">
<meta property="og:title" content="Kubick Studio">
<meta property="og:description" content="Инди-игры от Kubick Studio: Counter Aleksekys, Saratov Parkur, Dota Drop, Minecraft Drop.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800;900&family=Manrope:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #050605;
    --bg-deep: #020302;
    --surface: #0d100d;
    --line: rgba(184,255,41,0.22);
    --acid: #baff29;
    --acid-soft: rgba(186,255,41,0.14);
    --text: #eafbe4;
    --muted: #808c7a;
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  *{
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  ::selection{ background: transparent; }
  ::-moz-selection{ background: transparent; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    position: relative;
  }

  h1,h2,h3,.display{
    font-family: 'Unbounded', 'Manrope', sans-serif;
    margin:0;
    line-height: 1.1;
  }

  a{ color: inherit; text-decoration:none; }

  /* ---------- ambient acid grid backdrop ---------- */
  .grid-bg{
    position: fixed; inset: -10%;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 64px 64px;
    opacity: 0.35;
    mask-image: radial-gradient(circle at 50% 25%, black 0%, transparent 65%);
    animation: drift 40s linear infinite;
    z-index: 0;
    pointer-events: none;
  }
  @keyframes drift{
    from{ background-position: 0 0, 0 0; }
    to{ background-position: 128px 128px, 128px 128px; }
  }
  .glow-orb{
    position: fixed;
    width: 640px; height: 640px;
    top: -260px; left: 50%; transform: translateX(-50%);
    background: radial-gradient(circle, rgba(186,255,41,0.16), transparent 70%);
    filter: blur(10px);
    z-index: 0;
    pointer-events:none;
  }

  .wrap{
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 24px;
    position: relative;
    z-index: 1;
  }

  /* ---------- HERO ---------- */
  .hero{
    padding: 96px 0 72px;
    text-align: center;
    display:flex; flex-direction:column; align-items:center;
  }

  .hero h1{
    font-size: clamp(2.4rem, 8vw, 3.6rem);
    font-weight: 900;
    letter-spacing: 0.01em;
    color: var(--text);
    text-shadow: 0 0 28px rgba(186,255,41,0.35);
    opacity: 0;
    animation: rise 0.9s ease forwards;
    cursor: default;
    transition: text-shadow .3s ease;
  }
  .hero h1:hover{
    animation: rise 0.9s ease forwards, glitch 0.35s steps(2) 1;
  }
  @keyframes glitch{
    0%{ text-shadow: 2px 0 var(--acid), -2px 0 #ff2ec4; }
    50%{ text-shadow: -2px 0 var(--acid), 2px 0 #ff2ec4; }
    100%{ text-shadow: 0 0 28px rgba(186,255,41,0.35); }
  }

  @keyframes rise{
    from{ opacity:0; transform: translateY(18px); }
    to{ opacity:1; transform: translateY(0); }
  }

  /* wireframe rotating cube */
  .cube-stage{
    margin: 52px 0 44px;
    perspective: 620px;
    opacity: 0;
    animation: rise 0.9s ease 0.15s forwards;
  }
  .cube{
    position: relative;
    width: 128px; height: 128px;
    transform-style: preserve-3d;
    animation: spin 18s linear infinite;
  }
  .cube .face{
    position: absolute; inset: 0;
    width: 128px; height: 128px;
    border: 2px solid var(--acid);
    background-image:
      linear-gradient(var(--acid-soft), var(--acid-soft)),
      linear-gradient(45deg, transparent 48%, rgba(186,255,41,0.25) 49%, rgba(186,255,41,0.25) 51%, transparent 52%),
      linear-gradient(-45deg, transparent 48%, rgba(186,255,41,0.25) 49%, rgba(186,255,41,0.25) 51%, transparent 52%);
    box-shadow: inset 0 0 24px rgba(186,255,41,0.12);
  }
  /* each face gets its own opacity/glow so the box always reads as volumetric, not a flat square */
  .face-front { transform: translateZ(64px); opacity: 0.95; filter: drop-shadow(0 0 14px rgba(186,255,41,0.65)); }
  .face-back  { transform: rotateY(180deg) translateZ(64px); opacity: 0.35; }
  .face-right { transform: rotateY(90deg) translateZ(64px); opacity: 0.8; filter: drop-shadow(0 0 10px rgba(186,255,41,0.45)); }
  .face-left  { transform: rotateY(-90deg) translateZ(64px); opacity: 0.55; }
  .face-top   { transform: rotateX(90deg) translateZ(64px); opacity: 1; filter: drop-shadow(0 0 16px rgba(186,255,41,0.7)); }
  .face-bottom{ transform: rotateX(-90deg) translateZ(64px); opacity: 0.3; }

  @keyframes spin{
    from{ transform: rotateX(-32deg) rotateY(0deg); }
    to{ transform: rotateX(-32deg) rotateY(360deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .cube{ animation: none; transform: rotateX(-32deg) rotateY(-35deg); }
    .grid-bg{ animation: none; }
  }

  /* telegram pill button */
  .tg-btn{
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 16px 40px;
    border-radius: 999px;
    border: 1.5px solid var(--acid);
    background: var(--bg-deep);
    color: var(--acid);
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 1.02rem;
    letter-spacing: 0.02em;
    box-shadow: 0 0 0 0 rgba(186,255,41,0.5);
    animation: rise 0.9s ease 0.3s forwards, pulse 3.4s ease-in-out 1.2s infinite;
    opacity: 0;
    transition: background .25s ease, color .25s ease, transform .25s ease;
  }
  .tg-btn:hover{
    background: var(--acid);
    color: #04150a;
    transform: translateY(-2px) scale(1.03);
  }
  .tg-btn svg{ width: 22px; height: 22px; flex-shrink:0; }
  .tg-btn:hover svg{ fill: #04150a; }
  .tg-btn svg path{ fill: var(--acid); transition: fill .25s ease; }
  .tg-btn:hover svg path{ fill: #04150a; }

  @keyframes pulse{
    0%, 100%{ box-shadow: 0 0 0 0 rgba(186,255,41,0.35); }
    50%{ box-shadow: 0 0 0 10px rgba(186,255,41,0); }
  }

  /* ---------- GAMES ---------- */
  .games{
    padding: 60px 0 110px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
  }

  .game-card{
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 20px;
    text-align: center;
    opacity: 0;
    transform: translateY(28px);
    transition: opacity .7s ease, transform .7s ease, border-color .3s ease, box-shadow .3s ease;
  }
  .game-card.in-view{
    opacity: 1;
    transform: translateY(0);
  }
  .game-card:hover{
    border-color: var(--acid);
    box-shadow: 0 0 32px rgba(186,255,41,0.14);
  }

  .game-media{
    position: relative;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .game-media img{
    width: 100%;
    height: auto;
    max-height: 78vh;
    object-fit: contain;
    display: block;
    margin: 0 auto;
    background: var(--bg-deep);
    filter: grayscale(0.15) contrast(1.05);
    transition: transform .6s ease, filter .6s ease;
  }
  .game-card:hover .game-media img{
    transform: scale(1.06);
    filter: grayscale(0) contrast(1.1);
  }
  .game-media::after{
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.55));
    pointer-events: none;
  }

  .game-card h3{
    font-size: 1.35rem;
    font-weight: 700;
    margin-top: 22px;
  }

  .dl-btn{
    display: inline-flex;
    align-items:center;
    gap: 8px;
    margin-top: 18px;
    padding: 13px 30px;
    background: var(--acid);
    color: #04150a;
    font-weight: 800;
    font-size: 0.92rem;
    letter-spacing: 0.02em;
    border: 1px solid var(--acid);
    clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
    transition: background .25s ease, color .25s ease, transform .25s ease, box-shadow .25s ease;
  }
  .dl-btn:hover{
    background: transparent;
    color: var(--acid);
    transform: translateY(-2px);
    box-shadow: 0 0 24px rgba(186,255,41,0.4);
  }

  @media (max-width: 760px){
    .games{ grid-template-columns: 1fr; }
    .hero{ padding-top: 68px; }
    .cube-stage{ margin: 40px 0 34px; }
    .cube, .cube .face{ width: 100px; height: 100px; }
    .face-front { transform: translateZ(50px); }
    .face-back  { transform: rotateY(180deg) translateZ(50px); }
    .face-right { transform: rotateY(90deg) translateZ(50px); }
    .face-left  { transform: rotateY(-90deg) translateZ(50px); }
    .face-top   { transform: rotateX(90deg) translateZ(50px); }
    .face-bottom{ transform: rotateX(-90deg) translateZ(50px); }
    .cube-stage{ perspective: 480px; }
    .tg-btn{ padding: 14px 30px; }
  }

  /* ---------- DONATE ---------- */
  .donate{
    padding: 10px 0 90px;
    text-align: center;
  }
  .donate-label{
    color: var(--muted);
    font-size: 0.96rem;
    margin-bottom: 24px;
  }
  .donate-btn{
    position: relative;
    display: inline-block;
    padding: 3px;
    border: none;
    background: conic-gradient(from 0deg, var(--acid), transparent 22%, transparent 45%, var(--acid) 60%, transparent 82%, var(--acid));
    border-radius: 999px;
    cursor: pointer;
    font: inherit;
  }
  .donate-btn::after{
    content: '';
    position: absolute; inset: -8px;
    border-radius: 999px;
    background: inherit;
    filter: blur(14px);
    z-index: -1;
    animation: pulse-glow 2.6s ease-in-out infinite;
  }
  .donate-btn-inner{
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--bg-deep);
    color: var(--acid);
    padding: 17px 44px;
    border-radius: 999px;
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: 1.04rem;
    letter-spacing: 0.02em;
    animation: breathe 2.6s ease-in-out infinite;
    transition: background .25s ease, color .25s ease, transform .25s ease;
  }
  .donate-btn:hover .donate-btn-inner{
    background: var(--acid);
    color: #04150a;
    transform: scale(1.04);
    animation-play-state: paused;
  }
  .donate-btn svg{ width: 22px; height: 22px; flex-shrink: 0; }
  .donate-btn svg path{ fill: var(--acid); transition: fill .25s ease; }
  .donate-btn:hover svg path{ fill: #04150a; }

  @keyframes pulse-glow{
    0%, 100%{ opacity: 0.35; }
    50%{ opacity: 0.75; }
  }
  @keyframes breathe{
    0%, 100%{ transform: scale(1); }
    50%{ transform: scale(1.025); }
  }
  @media (prefers-reduced-motion: reduce){
    .donate-btn::after{ animation: none; }
    .donate-btn-inner{ animation: none; }
    .promo-img{ animation: none; }
    .promo-caption{ animation: none; }
  }

  .promo-link{
    margin-top: 40px;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .promo-img{
    display: block;
    width: 220px;
    max-width: 60vw;
    transform-origin: top center;
    animation: sway 3.2s ease-in-out infinite;
    transition: filter .3s ease;
  }
  .promo-link:hover .promo-img{
    filter: drop-shadow(0 0 20px rgba(186,255,41,0.5));
  }
  @keyframes sway{
    0%, 100%{ transform: rotate(-5deg); }
    50%{ transform: rotate(5deg); }
  }
  .promo-caption{
    font-family: 'Unbounded', sans-serif;
    font-weight: 700;
    font-size: clamp(2.2rem, 10vw, 3.3rem);
    letter-spacing: 0.1em;
    color: var(--acid);
    animation: caption-blink 1.8s ease-in-out infinite;
  }
  @keyframes caption-blink{
    0%, 100%{ opacity: 0.55; }
    50%{ opacity: 1; }
  }

  /* ---------- DONATE MODAL ---------- */
  .modal-overlay{
    position: fixed; inset: 0;
    background: rgba(2,3,2,0.82);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 200;
    opacity: 0;
    visibility: hidden;
    transition: opacity .3s ease, visibility .3s ease;
  }
  .modal-overlay.active{ opacity: 1; visibility: visible; }

  .modal-box{
    position: relative;
    width: 100%;
    max-width: 360px;
    background: var(--surface);
    border: 1px solid var(--acid);
    box-shadow: 0 0 44px rgba(186,255,41,0.22);
    padding: 38px 30px 32px;
    text-align: center;
    transform: scale(0.9) translateY(12px);
    transition: transform .3s ease;
    clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px);
  }
  .modal-overlay.active .modal-box{ transform: scale(1) translateY(0); }

  .modal-close{
    position: absolute; top: 12px; right: 16px;
    background: none; border: none;
    color: var(--muted);
    font-size: 1.3rem;
    line-height: 1;
    cursor: pointer;
    transition: color .2s ease;
  }
  .modal-close:hover{ color: var(--acid); }

  .modal-box h3{
    font-size: 1.28rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 28px;
  }

  .modal-options{
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .modal-option{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 16px 20px;
    border: 1.5px solid var(--acid);
    color: var(--acid);
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    background: transparent;
    transition: background .25s ease, color .25s ease, transform .2s ease;
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  }
  .modal-option:hover{
    background: var(--acid);
    color: #04150a;
    transform: translateY(-2px);
  }

  footer{
    text-align:center;
    padding: 30px 0 44px;
    color: var(--muted);
    font-size: 0.85rem;
    position: relative; z-index:1;
  }
</style>
</head>
<body>

<section class="donate wrap">

  <button type="button" class="donate-btn" onclick="openDonateModal()">
    <span class="donate-btn-inner">

  <!-- ВИДЖЕТ MINECRAFT DROP -->
  <div class="mcdrop-widget" id="mcdrop-widget" title="Играть в Minecraft Drop">
    <canvas id="mcdrop-canvas" width="400" height="400"></canvas>
  </div>
  <style>
  .mcdrop-widget{
    width:min(70vw,340px);
    margin:60px auto 30px;
    cursor:pointer;
    transition:transform .15s, box-shadow .25s ease;
    border: 1.5px solid var(--acid);
    background: var(--bg-deep);
    box-shadow: 0 0 22px rgba(186,255,41,0.25);
    padding: 10px;
  }
  .mcdrop-widget:hover{ transform:scale(1.06); box-shadow: 0 0 34px rgba(186,255,41,0.45); }
  .mcdrop-widget canvas{ width:100%; height:auto; display:block; image-rendering:pixelated; }
  </style>
  <script>
  (function(){
    const GAME_URL='https://haress484.github.io/Minecraft-Drop/index.html';
    const BASE='https://raw.githubusercontent.com/haress484/Minecraft-Drop/main/';
    const BLOCKS=['grass_block.png','dirt.png','stone_block.png','sand.png','coal_ore.png','iron_ore.png','diamond_ore.png','workbench.png','tnt.jpg','slime_block.png','obsidian.png'];
    const canvas=document.getElementById('mcdrop-canvas');
    const ctx=canvas.getContext('2d');
    const imgs={}; let pick=null;

    function makeTransparent(img,th=235){
      const c=document.createElement('canvas'); c.width=img.width; c.height=img.height;
      const x=c.getContext('2d'); x.drawImage(img,0,0);
      const d=x.getImageData(0,0,c.width,c.height);
      for(let i=0;i<d.data.length;i+=4){ if(d.data[i]>th&&d.data[i+1]>th&&d.data[i+2]>th) d.data[i+3]=0; }
      x.putImageData(d,0,0); return c;
    }
    BLOCKS.forEach((f,i)=>{ const im=new Image(); im.crossOrigin='anonymous'; im.onload=()=>{imgs[i]=im;}; im.src=BASE+f; });
    const pIm=new Image(); pIm.crossOrigin='anonymous'; pIm.onload=()=>{ pick=makeTransparent(pIm); }; pIm.src=BASE+'diamond_pickaxe.png';

    let idx=0, phase='windup', theta=15, parts=[], last=0;
    function spawn(x,y){ for(let i=0;i<12;i++) parts.push({x,y,vx:(Math.random()-.7)*6,vy:(Math.random()-.5)*6-2,life:1,size:4+Math.random()*4}); }

    function frame(ts){
      if(!last) last=ts;
      const dt=Math.min(ts-last,50)/1000; last=ts;
      ctx.clearRect(0,0,400,400);
      ctx.imageSmoothingEnabled=false;
      const cx=200, cy=200, bs=100, ps=120;
      const b=imgs[idx];
      if(b) ctx.drawImage(b,cx-bs/2,cy-bs/2,bs,bs);
      else { ctx.fillStyle='#8B4513'; ctx.fillRect(cx-bs/2,cy-bs/2,bs,bs); }
      if(phase==='windup'){ theta+=(55-15)*dt/0.15; if(theta>=55){theta=55;phase='swing';} }
      else if(phase==='swing'){ theta-=(55+150)*dt/0.10; if(theta<=-150){ theta=-150; phase='recover'; spawn(cx-bs/2+20,cy-bs/2+10); idx=(idx+1)%BLOCKS.length; } }
      else { theta+=(15+150)*dt/0.25; if(theta>=15){theta=15;phase='windup';} }
      if(pick){ ctx.save(); ctx.translate(cx+75,cy-10); ctx.rotate(theta*Math.PI/180); ctx.drawImage(pick,0,-ps,ps,ps); ctx.restore(); }
      for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.4; p.life-=0.03;
        if(p.life<=0) parts.splice(i,1);
        else { ctx.globalAlpha=p.life; ctx.fillStyle='#A0522D'; ctx.fillRect(p.x,p.y,p.size,p.size); ctx.globalAlpha=1; } }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    document.getElementById('mcdrop-widget').addEventListener('click',()=>{ window.open(GAME_URL,'_blank'); });
  })();
  </script>

<script>
  const cards = document.querySelectorAll('.game-card');
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting){
        e.target.classList.add('in-view');
        obs.unobserve(e.target);
      }
    });
  }, { threshold: 0.15 });
  cards.forEach(c => obs.observe(c));

  function openDonateModal(){
    document.getElementById('donateModal').classList.add('active');
    document.body.style.overflow = 'hidden';
  }
  function closeDonateModal(){
    document.getElementById('donateModal').classList.remove('active');
    document.body.style.overflow = '';
  }
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeDonateModal();
  });
</script>
